# GPU override — merge with docker-compose.yml to enable NVIDIA GPU support.
#
# Prerequisites (Linux / WSL2):
#   sudo apt-get install -y nvidia-container-toolkit
#   sudo nvidia-ctk runtime configure --runtime=docker
#   sudo systemctl restart docker
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d
#
# After enabling GPU, switch config.toml primary model to dmr/gpt-oss-vllm:
#   provider_id = "dmr"
#   model_id = "gpt-oss-vllm"

services:
  ironclaw:
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
