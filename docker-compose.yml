services:
  hugo:
    image: clawbot-ironclaw:latest
    build:
      context: ..
      dockerfile: clawbot/docker/ironclaw/Dockerfile
      args:
        - TARGET_ENV=${TARGET_ENV:-dev}
    working_dir: /site
    command: ["sh", "-c", "hugo server -D --bind 0.0.0.0 --port 1313 --navigateToChanged"]
    volumes:
      - ../ludekkvapil:/site
    ports:
      - "${HUGO_DEV_PORT:-1313}:1313"
      - "1314:1314"
      - "1315:1315"
      - "1316:1316"
      - "1317:1317"
      - "1318:1318"
      - "1319:1319"
      - "1320:1320"
    networks:
      - clawbot

  ironclaw-proxy:
    image: nginx:alpine
    ports:
      - "${OPENCLAW_PORT:-18790}:18790"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../scratch-ironclaw-repo/crates/ironclaw_webui_v2_static/static/js/pages/logs:/nginx-logs:ro
    depends_on:
      - ironclaw
    networks:
      - clawbot
      - agentic-ops

  # TLS terminator for the internal MCP gateway. Sits in both networks so
  # ironclaw (clawbot only) can reach mcpserver-gateway (agentic-ops only)
  # over https — the Reborn runtime rejects plain-http MCP endpoints.
  mcp-tls:
    image: nginx:alpine
    volumes:
      - ./mcp-tls/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./mcp-tls/certs:/etc/nginx/certs:ro
    networks:
      clawbot:
        aliases:
          - mcp-gateway.clawbot.internal
      agentic-ops:

  ironclaw:
    image: clawbot-ironclaw:latest
    build:
      context: ..
      dockerfile: clawbot/docker/ironclaw/Dockerfile
      args:
        - TARGET_ENV=${TARGET_ENV:-dev}
    env_file:
      - ../.env.shared
      - .env
    volumes:
      - ironclaw-runtime:/root/.ironclaw/reborn
      - ./ironclaw:/ironclaw-src:ro
      - ./ironclaw/workspace:/root/.ironclaw/reborn/workspace
      - ./AGENTS.md:/root/.ironclaw/reborn/workspace/AGENTS.md:ro
      - ../ludekkvapil:/site
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_API_KEY=${OLLAMA_API_KEY:-ollama-local}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - IRONCLAW_REBORN_WEBUI_TOKEN=${OPENCLAW_GATEWAY_TOKEN}
      - IRONCLAW_REBORN_WEBUI_USER_ID=reborn-cli
      # Registers the internal MCP gateway extension. Unset = extension is not
      # in the catalog at all. MCP_GATEWAY_TOKEN comes from .env via env_file.
      - CLAWBOT_MCP_GATEWAY_URL=${CLAWBOT_MCP_GATEWAY_URL:-https://mcp-gateway.clawbot.internal:8443/mcp/post}
      - VIRTUAL_HOST=clawbot.local
      - VIRTUAL_PORT=18789
      - VIRTUAL_PROTO=http
      - VIRTUAL_NETWORK=agentic-ops
      - HTTPS_METHOD=noredirect
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - hugo
      - openclaw-sandbox-browser
      - mcp-tls
    networks:
      - clawbot

  openclaw-sandbox-browser:
    image: browserless/chrome:latest
    environment:
      - CONNECTION_TIMEOUT=600000
      - MAX_CONCURRENT_SESSIONS=10
      - PREBOOT_CHROME=true
      - ENABLE_DEBUGGER=true
    shm_size: 2gb
    networks:
      - clawbot



networks:
  clawbot:
    driver: bridge
  agentic-ops:
    external: true

volumes:
  ironclaw-runtime:
