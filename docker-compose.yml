services:
  ironclaw-proxy:
    image: clawbot-ironclaw-proxy:latest
    build:
      context: .
      dockerfile: docker/ironclaw/Dockerfile
      target: proxy
    ports:
      - "${OPENCLAW_PORT:-18790}:18790"
    depends_on:
      - ironclaw
    networks:
      - clawbot
      - agentic-ops

  # TLS terminator for the internal MCP gateway. Sits in both networks so
  # ironclaw (clawbot only) can reach mcpserver-gateway (agentic-ops only)
  # over https — the Reborn runtime rejects plain-http MCP endpoints.
  mcp-tls:
    image: nginx:alpine
    volumes:
      - ./mcp-tls/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./mcp-tls/certs:/etc/nginx/certs:ro
    networks:
      clawbot:
        aliases:
          - mcp-gateway.clawbot.internal
      agentic-ops:

  ironclaw:
    image: clawbot-ironclaw:latest
    build:
      context: .
      dockerfile: docker/ironclaw/Dockerfile
      target: runner
      args:
        - TARGET_ENV=${TARGET_ENV:-dev}
    env_file:
      # Only this stack's own .env. ClawBot reaches every backend through the MCP
      # gateway, so it needs no backend credentials.
      - .env
    volumes:
      - ironclaw-runtime:/root/.ironclaw/reborn
      - ./ironclaw:/ironclaw-src:ro
      - ./ironclaw/workspace:/root/.ironclaw/reborn/workspace
      - ./AGENTS.md:/root/.ironclaw/reborn/workspace/AGENTS.md:ro
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_API_KEY=${OLLAMA_API_KEY:-ollama-local}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - IRONCLAW_REBORN_WEBUI_TOKEN=${OPENCLAW_GATEWAY_TOKEN}
      - IRONCLAW_REBORN_WEBUI_USER_ID=reborn-cli
      # Registers the internal MCP gateway extension. Unset = extension is not
      # in the catalog at all.
      # ClawBot's own gateway identity. The extension reads MCP_GATEWAY_TOKEN by
      # name, so it is pinned here to the per-agent token; that also overrides any
      # shared gateway token the operator-wide env file may carry.
      - MCP_GATEWAY_TOKEN=${AGENT_TOKEN_CLAWBOT:?set AGENT_TOKEN_CLAWBOT in clawbot/.env (the value registered with the gateway)}
      - AGENT_TOKEN_CLAWBOT=${AGENT_TOKEN_CLAWBOT}
      - CLAWBOT_MCP_GATEWAY_URL=${CLAWBOT_MCP_GATEWAY_URL:-https://mcp-gateway.clawbot.internal:8443/mcp/post}
      - VIRTUAL_HOST=clawbot.local
      - VIRTUAL_PORT=18789
      - VIRTUAL_PROTO=http
      - VIRTUAL_NETWORK=agentic-ops
      - HTTPS_METHOD=noredirect
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - openclaw-sandbox-browser
      - mcp-tls
    networks:
      - clawbot

  openclaw-sandbox-browser:
    image: browserless/chrome:latest
    environment:
      - CONNECTION_TIMEOUT=600000
      - MAX_CONCURRENT_SESSIONS=10
      - PREBOOT_CHROME=true
      - ENABLE_DEBUGGER=true
    shm_size: 2gb
    networks:
      - clawbot



networks:
  clawbot:
    driver: bridge
  agentic-ops:
    external: true

volumes:
  ironclaw-runtime:
