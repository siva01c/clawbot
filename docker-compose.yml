services:
  hugo:
    image: clawbot-openclaw:latest
    build:
      context: .
      dockerfile: docker/openclaw/Dockerfile
      args:
        - TARGET_ENV=${TARGET_ENV:-dev}
    working_dir: /site
    command: ["sh", "-c", "hugo server -D --bind 0.0.0.0 --port 1313"]
    volumes:
      - ../ludekkvapil:/site
    ports:
      - "${HUGO_DEV_PORT:-1313}:1313"
    networks:
      - clawbot

  openclaw:
    image: clawbot-openclaw:latest
    build:
      context: .
      dockerfile: docker/openclaw/Dockerfile
      args:
        - TARGET_ENV=${TARGET_ENV:-dev}
    env_file:
      - .env
    volumes:
      - openclaw-runtime:/root/.openclaw
      - ./openclaw:/openclaw-src:ro
      - ./openclaw/workspace:/root/.openclaw/workspace
      - ./AGENTS.md:/root/.openclaw/workspace/AGENTS.md:ro
      - ../ludekkvapil:/site
    ports:
      - "${OPENCLAW_PORT:-18789}:18789"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - DMR_BASE_URL=http://host.docker.internal:12434/engines/v1
      - OLLAMA_API_KEY=${OLLAMA_API_KEY:-ollama-local}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - hugo
      - openclaw-sandbox-browser
      - mcp
    networks:
      - clawbot
      - agentic-ops

  openclaw-sandbox-browser:
    image: browserless/chrome:latest
    environment:
      - CONNECTION_TIMEOUT=600000
      - MAX_CONCURRENT_SESSIONS=10
      - PREBOOT_CHROME=true
      - ENABLE_DEBUGGER=true
    shm_size: 2gb
    networks:
      - clawbot

  osint:
    build:
      context: ./services/linkedin
      dockerfile: Dockerfile
    container_name: osintbot-linkedin
    env_file:
      - .env
    environment:
      - SELENIUM_REMOTE_URL=http://selenium:4444/wd/hub
    volumes:
      - ./services/linkedin:/app
    ports:
      - "7860:7860"
    depends_on:
      - selenium
    command: ["python", "linkedin_tool.py", "chat", "--host", "0.0.0.0", "--port", "7860"]
    networks:
      - clawbot

  mcp:
    build:
      context: ./services/linkedin
      dockerfile: Dockerfile
    container_name: osintbot-mcp
    env_file:
      - .env
    environment:
      - OSINT_MCP_PORT=7861
      - POSTS_PATH=/app/posts.json
    volumes:
      - ./services/linkedin:/app
    ports:
      - "7861:7861"
    command: ["python", "osint_mcp.py"]
    restart: unless-stopped
    networks:
      clawbot:
      agentic-ops:
        aliases:
          - osint-mcp

  selenium:
    image: selenium/standalone-chrome:latest
    container_name: osintbot-selenium
    hostname: selenium
    shm_size: 2gb
    ports:
      - "4445:4444"
      - "7901:7900"
    networks:
      - clawbot


networks:
  clawbot:
    driver: bridge
  agentic-ops:
    external: true

volumes:
  openclaw-runtime:
