services:
  hugo:
    image: clawbot-ironclaw:latest
    build:
      context: ..
      dockerfile: clawbot/docker/ironclaw/Dockerfile
      args:
        - TARGET_ENV=${TARGET_ENV:-dev}
    working_dir: /site
    command: ["sh", "-c", "hugo server -D --bind 0.0.0.0 --port 1313 --navigateToChanged"]
    volumes:
      - ../ludekkvapil:/site
    ports:
      - "${HUGO_DEV_PORT:-1313}:1313"
      - "1314:1314"
      - "1315:1315"
      - "1316:1316"
      - "1317:1317"
      - "1318:1318"
      - "1319:1319"
      - "1320:1320"
    networks:
      - clawbot

  ironclaw:
    image: clawbot-ironclaw:latest
    build:
      context: ..
      dockerfile: clawbot/docker/ironclaw/Dockerfile
      args:
        - TARGET_ENV=${TARGET_ENV:-dev}
    env_file:
      - ../.env.shared
      - .env
    volumes:
      - ironclaw-runtime:/root/.ironclaw/reborn
      - ./ironclaw:/ironclaw-src:ro
      - ./openclaw/workspace:/root/.ironclaw/reborn/workspace
      - ./AGENTS.md:/root/.ironclaw/reborn/workspace/AGENTS.md:ro
      - ../ludekkvapil:/site
    ports:
      - "${OPENCLAW_PORT:-18789}:18789"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - DMR_BASE_URL=http://host.docker.internal:12434/engines/v1
      - OLLAMA_API_KEY=${OLLAMA_API_KEY:-ollama-local}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - IRONCLAW_REBORN_WEBUI_TOKEN=${OPENCLAW_GATEWAY_TOKEN}
      - IRONCLAW_REBORN_WEBUI_USER_ID=reborn-cli
      - VIRTUAL_HOST=clawbot.local
      - VIRTUAL_PORT=18789
      - VIRTUAL_PROTO=http
      - VIRTUAL_NETWORK=agentic-ops
      - HTTPS_METHOD=noredirect
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - hugo
      - openclaw-sandbox-browser
      - mcp
    networks:
      - clawbot
      - agentic-ops

  openclaw-sandbox-browser:
    image: browserless/chrome:latest
    environment:
      - CONNECTION_TIMEOUT=600000
      - MAX_CONCURRENT_SESSIONS=10
      - PREBOOT_CHROME=true
      - ENABLE_DEBUGGER=true
    shm_size: 2gb
    networks:
      - clawbot



networks:
  clawbot:
    driver: bridge
  agentic-ops:
    external: true

volumes:
  ironclaw-runtime:
