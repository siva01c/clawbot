# TLS terminator in front of mcpserver-gateway.
#
# The Reborn runtime refuses to talk to a hosted MCP server over plain http:
# the URL check, the discovery check, and the runtime-credential audience all
# require https. The gateway itself only speaks http inside `agentic-ops`, so
# this container bridges the two networks and adds TLS with a CA that the
# ironclaw image trusts (see docker/ironclaw/Dockerfile).
server {
    listen 8443 ssl;
    server_name mcp-gateway.clawbot.internal;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Bounded by the gateway's own GATEWAY_BACKEND_TIMEOUT (300s default).
    # osintbot investigations legitimately run for minutes, so the proxy must
    # not time out before the backend does.
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;

    location / {
        proxy_pass http://mcpserver-gateway:8100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Buffering off so SSE-framed backend replies (redmine) stream through
        # instead of being held until the response completes.
        proxy_buffering off;
    }
}
