server {
    listen 18790;

    # The ironclaw binary's embedded SPA is missing the whole
    # js/pages/logs/ tree — .gitignore's `**/logs/` swallowed the source
    # directory, so build.rs had nothing to embed. Serve that one
    # directory from the source checkout; without it the SPA's ES module
    # graph 404s and nothing renders, login page included.
    location ^~ /v2/js/pages/logs/ {
        alias /nginx-logs/;
    }

    # Proxy everything else to ironclaw
    location / {
        proxy_pass http://ironclaw:18789;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
