server {
    listen 18790;

    # Serve js/pages/logs/ from the copy the proxy image (Dockerfile, target
    # `proxy`) takes from the IronClaw source. The binary's embedded SPA can
    # lack that directory (a `**/logs/` ignore rule swallows it); without it
    # the SPA's ES module graph 404s and nothing renders, login page included.
    location ^~ /v2/js/pages/logs/ {
        alias /nginx-logs/;
    }

    # Proxy everything else to ironclaw
    location / {
        proxy_pass http://ironclaw:18789;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
